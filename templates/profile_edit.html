<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings | Registry</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet" />
    <style>
        :root { --atticl-purple: #8F5BFD; --atticl-black: #000; --atticl-gray: #121212; --atticl-border: #333; --atticl-white: #FFF; --atticl-text-muted: #A0A0A0;}
        body { font-family: 'Poppins', sans-serif; max-width: 800px; margin: 0 auto; padding: 20px; background-color: var(--atticl-black); color: var(--atticl-white); }
        
        nav { display: flex; justify-content: space-between; align-items: center; padding: 20px 0; border-bottom: 1px solid var(--atticl-border); margin-bottom: 40px; }
        .logo { font-size: 1.5rem; font-weight: 600; color: var(--atticl-purple); text-decoration: none; display: flex; align-items: center; gap: 8px; }
        
        .card { background-color: var(--atticl-gray); padding: 40px; border-radius: 8px; border: 1px solid var(--atticl-border); }
        h1 { margin-top: 0; margin-bottom: 30px; display: flex; align-items: center; gap: 10px; }

        .tabs { display: flex; gap: 20px; margin-bottom: 30px; border-bottom: 1px solid var(--atticl-border); }
        .tab { padding: 12px 20px; cursor: pointer; color: var(--atticl-text-muted); font-weight: 600; transition: all 0.2s; position: relative; }
        .tab.active { color: var(--atticl-purple); }
        .tab.active::after { content: ''; position: absolute; bottom: -1px; left: 0; width: 100%; height: 2px; background: var(--atticl-purple); }

        .tab-content { display: none; }
        .tab-content.active { display: block; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

        .form-group { margin-bottom: 25px; }
        label { display: block; margin-bottom: 8px; color: var(--atticl-text-muted); font-size: 0.9rem; font-weight: 600; }
        input, textarea { width: 100%; background-color: var(--atticl-black); border: 1px solid var(--atticl-border); padding: 12px; border-radius: 5px; color: var(--atticl-white); font-family: inherit; font-size: 1rem; box-sizing: border-box; outline: none; transition: border-color 0.2s; }
        input:focus, textarea:focus { border-color: var(--atticl-purple); }
        textarea { resize: vertical; min-height: 100px; }

        .btn { background-color: var(--atticl-purple); color: var(--atticl-white); border: none; padding: 12px 24px; border-radius: 5px; cursor: pointer; font-weight: 600; font-size: 1rem; transition: background 0.2s; display: flex; align-items: center; gap: 8px; }
        .btn:hover { filter: brightness(1.1); }
        .btn-outline { background: none; border: 1px solid var(--atticl-border); }
        .btn-outline:hover { border-color: var(--atticl-purple); color: var(--atticl-purple); }

        .token-list { margin-top: 30px; display: flex; flex-direction: column; gap: 15px; }
        .token-item { background: var(--atticl-black); padding: 20px; border-radius: 8px; border: 1px solid var(--atticl-border); display: flex; justify-content: space-between; align-items: center; }
        .token-info h4 { margin: 0; font-size: 1.1rem; }
        .token-info p { margin: 5px 0 0; color: var(--atticl-text-muted); font-size: 0.85rem; font-family: monospace; }
        
        .revoke-btn { color: #ff4444; background: none; border: 1px solid #442222; padding: 5px 10px; border-radius: 4px; cursor: pointer; font-size: 0.8rem; display: flex; align-items: center; gap: 4px; transition: all 0.2s; }
        .revoke-btn:hover { background: rgba(255, 68, 68, 0.1); border-color: #ff4444; }

        #message { margin-top: 20px; padding: 15px; border-radius: 5px; display: none; }
        .success { background: rgba(0, 255, 0, 0.1); color: #00ff00; border: 1px solid #004400; }
        .error { background: rgba(255, 0, 0, 0.1); color: #ff4444; border: 1px solid #440000; }
    </style>
</head>
<body>

    <nav>
        <a href="/" class="logo"><span class="material-symbols-outlined">box</span> Registry</a>
        <a href="javascript:history.back()" style="color: var(--atticl-white); text-decoration: none;">Back to Profile</a>
    </nav>

    <div class="card">
        <h1><span class="material-symbols-outlined">settings</span> User Settings</h1>

        <div class="tabs">
            <div class="tab active" onclick="switchTab('profile')">Public Profile</div>
            <div class="tab" onclick="switchTab('account')">Account Security</div>
            <div class="tab" onclick="switchTab('tokens')">API Tokens</div>
        </div>

        <div id="message"></div>

        <!-- Profile Tab -->
        <div id="profile-content" class="tab-content active">
            <div class="form-group">
                <label>Bio</label>
                <textarea id="bio" placeholder="Tell the world about yourself..."></textarea>
            </div>
            <div class="form-group">
                <label>GitHub Profile URL</label>
                <input type="text" id="github_url" placeholder="https://github.com/username">
            </div>
            <div class="form-group">
                <label>Twitter Profile URL</label>
                <input type="text" id="twitter_url" placeholder="https://twitter.com/username">
            </div>
            <div class="form-group">
                <label>Website URL</label>
                <input type="text" id="website_url" placeholder="https://yourwebsite.com">
            </div>
            <button class="btn" onclick="updateProfile()">
                <span class="material-symbols-outlined">save</span> Save Profile
            </button>
        </div>

        <!-- Account Tab -->
        <div id="account-content" class="tab-content">
            <h3 style="margin-top: 0;">Change Password</h3>
            <div class="form-group">
                <label>Current Password</label>
                <input type="password" id="old-password">
            </div>
            <div class="form-group">
                <label>New Password</label>
                <input type="password" id="new-password">
            </div>
            <div class="form-group">
                <label>Confirm New Password</label>
                <input type="password" id="confirm-password">
            </div>
            <button class="btn" onclick="updatePassword()">
                <span class="material-symbols-outlined">lock_reset</span> Update Password
            </button>
        </div>

        <!-- Tokens Tab -->
        <div id="tokens-content" class="tab-content">
            <h3 style="margin-top: 0;">Personal Access Tokens</h3>
            <p style="color: var(--atticl-text-muted); font-size: 0.9rem; margin-bottom: 20px;">Use these tokens to authenticate with the CLI or API without your password.</p>
            
            <div class="form-group" style="display: flex; gap: 10px;">
                <input type="text" id="token-name" placeholder="Token description (e.g. CI/CD)">
                <button class="btn" onclick="createToken()" style="white-space: nowrap;">
                    <span class="material-symbols-outlined">add</span> Create Token
                </button>
            </div>

            <div id="token-display-box" class="hidden" style="margin-bottom: 30px; background: rgba(143, 91, 253, 0.1); padding: 20px; border-radius: 8px; border: 1px solid var(--atticl-purple);">
                <p style="color: var(--atticl-purple); font-weight: 600; margin: 0 0 10px 0;">New token generated!</p>
                <p style="font-size: 0.8rem; margin: 0 0 15px 0;">Make sure to copy it now. You won't be able to see it again.</p>
                <div style="display: flex; gap: 10px;">
                    <input type="text" id="new-token-val" readonly style="border-color: var(--atticl-purple);">
                    <button class="btn btn-outline" onclick="copyNewToken()">Copy</button>
                </div>
            </div>

            <div class="token-list" id="token-list">
                <!-- Tokens will be loaded here -->
            </div>
        </div>
    </div>

    <script>
        const token = localStorage.getItem('pkgd_token');
        if (!token) window.location.href = '/login';

        function switchTab(tab) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            
            const selectedTab = [...document.querySelectorAll('.tab')].find(t => t.innerText.toLowerCase().includes(tab));
            selectedTab.classList.add('active');
            document.getElementById(`${tab}-content`).classList.add('active');

            if (tab === 'tokens') loadTokens();
        }

        async function loadProfile() {
            try {
                const res = await fetch('/api/profile', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (res.ok) {
                    const user = await res.json();
                    document.getElementById('bio').value = user.bio || '';
                    // We need another endpoint or richer response to get social links initially
                    // For now, we'll assume bio is working and we'll fetch full profile if needed
                }
            } catch (err) { console.error(err); }
        }

        async function updateProfile() {
            const payload = {
                bio: document.getElementById('bio').value,
                github_url: document.getElementById('github_url').value,
                twitter_url: document.getElementById('twitter_url').value,
                website_url: document.getElementById('website_url').value,
            };

            try {
                const res = await fetch('/api/profile/update', {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}` 
                    },
                    body: JSON.stringify(payload)
                });

                if (res.ok) showMessage('Profile updated successfully!', 'success');
                else showMessage('Failed to update profile.', 'error');
            } catch (err) { showMessage('An error occurred.', 'error'); }
        }

        async function updatePassword() {
            const old_password = document.getElementById('old-password').value;
            const new_password = document.getElementById('new-password').value;
            const confirm = document.getElementById('confirm-password').value;

            if (new_password !== confirm) return showMessage('Passwords do not match.', 'error');

            try {
                const res = await fetch('/api/profile/password', {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}` 
                    },
                    body: JSON.stringify({ old_password, new_password })
                });

                if (res.ok) {
                    showMessage('Password updated successfully!', 'success');
                    document.getElementById('old-password').value = '';
                    document.getElementById('new-password').value = '';
                    document.getElementById('confirm-password').value = '';
                } else {
                    showMessage('Incorrect current password.', 'error');
                }
            } catch (err) { showMessage('An error occurred.', 'error'); }
        }

        async function loadTokens() {
            const list = document.getElementById('token-list');
            list.innerHTML = 'Loading tokens...';
            try {
                const res = await fetch('/api/profile/tokens', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (res.ok) {
                    const tokens = await res.json();
                    renderTokens(tokens);
                }
            } catch (err) { list.innerHTML = 'Failed to load tokens.'; }
        }

        function renderTokens(tokens) {
            const list = document.getElementById('token-list');
            if (tokens.length === 0) {
                list.innerHTML = '<p style="text-align: center; color: var(--atticl-text-muted);">No active tokens found.</p>';
                return;
            }
            list.innerHTML = tokens.map(t => `
                <div class="token-item">
                    <div class="token-info">
                        <h4>${t.name}</h4>
                        <p>Created on ${new Date(t.created_at).toLocaleDateString()}</p>
                        <p style="color: #444;">${t.token.substring(0, 8)}************************</p>
                    </div>
                    <button class="revoke-btn" onclick="revokeToken('${t.token}')">
                        <span class="material-symbols-outlined" style="font-size: 16px;">cancel</span> Revoke
                    </button>
                </div>
            `).join('');
        }

        async function createToken() {
            const name = document.getElementById('token-name').value;
            try {
                const res = await fetch('/api/profile/tokens', {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}` 
                    },
                    body: JSON.stringify({ name })
                });

                if (res.ok) {
                    const newToken = await res.json();
                    document.getElementById('new-token-val').value = newToken.token;
                    document.getElementById('token-display-box').classList.remove('hidden');
                    document.getElementById('token-name').value = '';
                    loadTokens();
                }
            } catch (err) { showMessage('Failed to create token.', 'error'); }
        }

        function copyNewToken() {
            const val = document.getElementById('new-token-val');
            val.select();
            document.execCommand('copy');
            alert('Token copied to clipboard!');
        }

        async function revokeToken(tokenToRevoke) {
            if (!confirm('Are you sure you want to revoke this token? Any application using it will lose access.')) return;
            try {
                const res = await fetch(`/api/profile/tokens/${tokenToRevoke}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (res.ok) loadTokens();
            } catch (err) { showMessage('Failed to revoke token.', 'error'); }
        }

        function showMessage(text, type) {
            const msg = document.getElementById('message');
            msg.innerText = text;
            msg.className = type;
            msg.style.display = 'block';
            setTimeout(() => { msg.style.display = 'none'; }, 5000);
        }

        loadProfile();
    </script>
</body>
</html>
